global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'trading-api'
    static_configs:
      - targets: [ 'trading-api:8080' ]

  - job_name: 'postgres'
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]

  - job_name: 'execution-engine'
    static_configs:
      - targets: ['execution-engine:8081']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']